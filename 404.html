<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Madhavan Lab</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .tip-group { animation: tipBounce 1.2s steps(1) infinite; }
    .crash-sparks { animation: sparksToggle 1.2s steps(1) infinite; }
    .hover-glow { animation: glowToggle 1.2s steps(1) infinite; }
    @keyframes tipBounce {
      0%, 49%  { transform: translateY(0px); }
      50%, 100% { transform: translateY(98px); }
    }
    @keyframes sparksToggle {
      0%, 49%  { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    @keyframes glowToggle {
      0%, 49%  { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .not-found {
      min-height: calc(100vh - 68px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      text-align: center;
    }
    .not-found__animation {
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 2.5rem;
      border: 1px solid var(--gray-2);
    }
    .not-found h1 {
      font-family: var(--mono);
      font-size: 5rem;
      font-weight: 400;
      color: var(--blue);
      line-height: 1;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    .not-found__sub {
      font-family: var(--serif);
      font-size: 1.5rem;
      color: var(--gray-4);
      margin-bottom: 1rem;
    }
    .not-found__msg {
      font-size: 1rem;
      color: var(--gray-3);
      max-width: 400px;
      margin-bottom: 2.5rem;
    }
    .not-found__links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav__inner">
    <a href="/index.html" class="nav__brand">
      <span class="nav__brand-name">Madhavan Lab</span>
      <span class="nav__brand-sub">University of Illinois Urbana-Champaign</span>
    </a>
    <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav__links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/pages/about.html">About</a></li>
      <li><a href="/pages/research.html">Research</a></li>
      <li><a href="/pages/people.html">People</a></li>
      <li><a href="/pages/lab.html">The Lab</a></li>
      <li><a href="/pages/publications.html">Publications</a></li>
      <li><a href="/pages/blog.html">Blog</a></li>
    </ul>
  </div>
</nav>

<div class="page-wrap">
  <div class="not-found">

    <div class="not-found__animation">
      <svg width="100%" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
        <style>
          .tip-anim { animation: tipSnap 1.4s steps(1) infinite; }
          .sparks-anim { animation: sparksSnap 1.4s steps(1) infinite; }
          .glow-anim  { animation: glowSnap  1.4s steps(1) infinite; }
          @keyframes tipSnap {
            0%,49%   { transform: translateY(0px); }
            50%,100% { transform: translateY(112px); }
          }
          @keyframes sparksSnap {
            0%,49%   { opacity: 0; }
            50%,100% { opacity: 1; }
          }
          @keyframes glowSnap {
            0%,49%   { opacity: 1; }
            50%,100% { opacity: 0; }
          }
        </style>

        <rect width="480" height="300" fill="#f8f7f5"/>

        <!-- ATOMS -->
        <circle cx="156" cy="248" r="18" fill="#e84a27"/>
        <circle cx="196" cy="248" r="18" fill="#e84a27"/>
        <circle cx="236" cy="248" r="18" fill="#e84a27"/>
        <circle cx="276" cy="248" r="18" fill="#e84a27"/>
        <circle cx="316" cy="248" r="18" fill="#e84a27"/>

        <!-- SPARKS -->
        <g class="sparks-anim">
          <line x1="224" y1="227" x2="212" y2="216" stroke="#e84a27" stroke-width="2.5"/>
          <line x1="248" y1="227" x2="260" y2="216" stroke="#e84a27" stroke-width="2.5"/>
          <line x1="217" y1="230" x2="204" y2="225" stroke="#c0401f" stroke-width="2"/>
          <line x1="255" y1="230" x2="268" y2="225" stroke="#c0401f" stroke-width="2"/>
          <line x1="236" y1="224" x2="236" y2="210" stroke="#e84a27" stroke-width="2.5"/>
        </g>

        <!-- HOVER GLOW -->
        <g class="glow-anim">
          <ellipse cx="236" cy="228" rx="14" ry="4" fill="#e84a27" opacity="0.3"/>
        </g>

        <!-- TIP: concave-sided, narrow base -->
        <g class="tip-anim" style="transform-origin:236px 60px;">
          <path d="M 193,15 Q 236,15 236,128 Q 236,15 279,15 Z"
            fill="#f8f7f5" stroke="#13294b" stroke-width="3" stroke-linejoin="round"/>
        </g>

      </svg>
    </div>    </div>

    <h1>404</h1>
    <p class="not-found__sub">The tip has crashed.</p>
    <p class="not-found__msg">The page you're looking for doesn't exist — it may have moved or been removed.</p>
    <div class="not-found__links">
      <a href="/index.html" class="btn btn--primary">Back to Home</a>
      <a href="/pages/research.html" class="btn btn--outline">Our Research</a>
      <a href="/pages/publications.html" class="btn btn--outline">Publications</a>
    </div>

  </div>
</div>

<script src="/js/main.js"></script>
</body>
</html>
